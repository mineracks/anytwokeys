[package]
name = "anytwokeys"
version = "0.1.1"
description = "Any Two Keys — a Bitcoin vault signed by your YubiKeys (research software)"
authors = ["mineracks pty ltd"]
license = "MIT"
edition = "2021"

[lib]
name = "anytwokeys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
bitcoin = { version = "0.32", features = ["serde", "rand-std", "base64", "secp-recovery"] }
miniscript = { version = "12", features = ["serde"] }
electrum-client = { version = "0.23", default-features = false, features = ["use-rustls-ring", "proxy"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# a node's self-signed certificate is pinned by fingerprint (node.rs): rustls direct, the same backend reqwest uses
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
dirs = "6"
num-bigint = "0.4"
num-traits = "0.2"
ur = "0.5"
ciborium = "0.2"
qrcode = { version = "0.14", default-features = false }
# labels backed up on a VSS host (labels.rs)
vss-client-ng = { version = "0.6", default-features = false, features = ["sigs-auth"] }
prost = "0.11"   # the same protobuf the VSS client speaks: attachment pieces go over our own HTTP call (labels.rs)
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# the little map on a transaction (map.rs): tiles are gzip, drawing is done here so the window never touches tile data
flate2 = "1"
# the chain cache (db.rs): SQLite, encrypted whole-file by SQLCipher with a key derived from the store key
# descriptor shares (sskrdesc.rs): Blockchain Commons' reference Gordian Envelope + SSKR — the descriptor encrypted, its key split
bc-envelope = "0.43"
bc-components = "0.31"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format", "simd"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
scrypt = { version = "0.11", default-features = false, features = ["simple", "std"] }
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
bech32 = "0.11"
bip39 = { version = "2", features = ["rand", "zeroize"] }
zeroize = "1"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

# the store key's slot on this Mac: a Keychain item, behind a Touch ID / password prompt (lockbox.rs)
# the wire to a key on a computer is PC/SC; on a phone it is the keylink plugin (transport.rs)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
hidapi = "2"                                   # Nitrokey firmware over CTAPHID (nkfw.rs): no HID on iOS or Android
pcsc = "2"
# the SeedHammer v1 engraver is a USB-serial device (engraver.rs); a phone has no serial port
serialport = { version = "4", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-keylink = { path = "plugins/keylink" }

# the Keychain and "is someone entitled here" (Touch ID, Face ID, the device's passcode) are the same calls on a Mac and an iPhone
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSObject", "NSDate"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLLocationManagerDelegate", "CLLocation", "CLError"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

# macOS 26+/27 dyld refuses proc-macro dylibs that Cargo's release profile strips with rustc's own
# Mach-O writer ("mis-aligned LINKEDIT string pool"). Leave build scripts and proc macros unstripped.
[profile.release.build-override]
strip = "none"
opt-level = 0

# swift-rs builds the Swift halves of the plugins. Xcode 27 moved where SwiftPM puts its products and hides the
# functions Rust calls in a release build; the copy in vendor/ finds the one and puts back the other (it needs
# `rustup component add llvm-tools`). Kept here, in git, so a release build for the iPhone does not depend on a
# file patched by hand in one computer's download cache.
[patch.crates-io]
swift-rs = { path = "vendor/swift-rs" }
# tao handed UIKit a scene configuration it had already released; a release build on iOS crashed at launch. One line.
tao = { path = "vendor/tao" }
