[package]
name = "anytwokeys"
version = "0.1.0"
description = "Any Two Keys — a Bitcoin vault signed by your YubiKeys (research software)"
authors = ["mineracks pty ltd"]
license = "MIT"
edition = "2021"

[lib]
name = "anytwokeys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
pcsc = "2"
bitcoin = { version = "0.32", features = ["serde", "rand-std", "base64"] }
miniscript = { version = "12", features = ["serde"] }
electrum-client = { version = "0.23", default-features = false, features = ["use-rustls-ring", "proxy"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
